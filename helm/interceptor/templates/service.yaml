apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-interceptor
  labels:
    app: {{ .Release.Name }}-interceptor
spec:
  type: {{ .Values.servicio.tipo }}

  # Sin esto, el pod NO ve la IP real del cliente.
  #
  # Con la politica por omision (Cluster), el nodo que recibe el paquete puede
  # reenviarlo a otro nodo, y para que la respuesta vuelva por el mismo camino
  # reescribe la direccion de origen con la suya. El interceptor terminaba
  # consultando al API por una IP interna (10.56.1.1), que no esta en
  # ip_to_country, asi que todo caia en el pais comodin ZZ y la geolocalizacion
  # no funcionaba: daba igual que region configuraras en la coleccion zonas.
  #
  # Con Local el nodo solo entrega a pods que esten en el mismo nodo, no hay
  # reescritura, y llega la IP del cliente.
  #
  # El costo: un nodo sin replica del pod queda fuera de rotacion. Con una
  # replica y un nodo por cluster, no cambia nada.
  externalTrafficPolicy: Local

  {{- if .Values.servicio.ipEstatica }}
  # Solo se emite la clave si hay valor. Un loadBalancerIP vacio es un error de
  # validacion, no un "sin preferencia".
  loadBalancerIP: {{ .Values.servicio.ipEstatica }}
  {{- end }}

  selector:
    app: {{ .Release.Name }}-interceptor

  ports:
    - name: dns
      # Aqui esta la traduccion que evita necesitar privilegios: el mundo ve el
      # 53, el contenedor escucha en el 5000. El mapeo lo hace Kubernetes.
      port: {{ .Values.servicio.puerto }}
      targetPort: dns
      # protocol: UDP es obligatorio. El valor por defecto es TCP, y con el las
      # consultas DNS no llegarian nunca sin ningun error visible.
      protocol: UDP

# Una vez desplegado, la IP asignada se consulta con:
#
#     kubectl get svc {{ .Release.Name }}-interceptor
#
# Esa IP es la que va en el registro NS del dominio en FreeDNS.
